spring.application.name=smart-banking-fraud-detection

# ---------- Database (PostgreSQL) ----------
spring.datasource.url=jdbc:postgresql://localhost:5432/smart_banking_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ---------- Server ----------
server.port=8080

# ---------- JWT ----------
# 256-bit secret used to sign tokens - replace in production and load from env/secret manager
jwt.secret=ReplaceThisWithA256BitSecretKeyForSmartBankingApp2026!!
jwt.expiration.ms=86400000

# ---------- Fraud Detection Rules (configurable thresholds) ----------
fraud.rule.high-amount-threshold=100000
fraud.rule.max-transfers-per-window=5
fraud.rule.window-minutes=10
fraud.rule.max-failed-logins=3

# ---------- Swagger ----------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs

# ---------- Logging ----------
logging.level.org.springframework.security=INFO
logging.level.com.bank.frauddetection=DEBUG
